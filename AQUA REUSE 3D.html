const SCI='<h3>Ғылыми түсіндірме</h3><p><b>Булану</b> — судың сұйық күйден газ күйіне ауысуы. Жылдамдығы температураға, бет ауданына, ауа ылғалдылығына және желге байланысты.</p><p><b>Конденсация</b> — су буының сұйық күйге ауысуы.</p><p>Күн дистилляциясында еріген ұшпайтын тұздар негізінен бастапқы суда қалады. Ұшпа заттар мен басқа қоспалар қосымша тазалауды қажет етуі мүмкін.</p><p><b>Фотоэлектрлік панель</b> электр энергиясын өндіреді, суды қыздырмайды. Су камерадағы қара беттің тікелей күн жылуымен қызады; жылу алу үшін бөлек жылу коллекторы қолданылады.</p><p><b>Ескерту:</b> бұл — визуалды модельдеу. Анимация нақты өнімділікті, тазарту пайызын немесе сағатына алынатын су көлемін растамайды. Температура көрсеткіштері — модельдік. Алынған дистиллят ішуге жарамды деп есептелмейді. Ащыбұлақ суының нақты құрамы бұл модельде көрсетілмеген. Барлық өлшемдер — жобалық.</p>';
